<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الصرح التعليمي</title>
<style>body{margin:0;background:#f4f7fc;color:#092e62;font-family:Tahoma,Arial;min-height:100vh;display:grid;place-items:center}.box{background:white;border-radius:22px;padding:35px;max-width:440px;width:85%;box-shadow:0 10px 45px #10294b18}h1{font-size:27px}p{font-size:13px;color:#71829b;line-height:2}input{width:100%;box-sizing:border-box;padding:14px;margin:12px 0;border:1px solid #ccd9e9;border-radius:12px;direction:ltr}button{background:#092e62;color:white;border:0;border-radius:12px;padding:13px 24px;cursor:pointer;width:100%}small{color:#b03245}</style>
<div class="box"><h1>الصرح التعليمي</h1><p>أدخل رابط خادم المؤسسة الذي تم نشره على الإنترنت. ستُحفظ الإعدادات على هذا الكمبيوتر.</p><form id="f"><input id="u" type="url" placeholder="https://school.yourdomain.com" required pattern="https://.*"><button type="submit">فتح المنظومة</button></form><p><small id="err"></small></p></div>
<script>/* The launcher has no privileged renderer APIs. Configure URL using navigation back to main process below. */
document.querySelector('#f').onsubmit=e=>{e.preventDefault();const url=document.querySelector('#u').value.trim();if(!/^https:\/\/[a-z0-9.-]+(?::\d+)?$/i.test(url))document.querySelector('#err').textContent='أدخل رابط HTTPS الصحيح بدون مسار إضافي';else location.href='alsarh-config://'+encodeURIComponent(url);};</script></html>
