plugins {
    id 'com.android.application'
}
android {
    namespace 'com.alsarh.educational'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alsarh.educational'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
    sourceSets { main.assets.srcDirs += ['../../web'] }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
