services:
  alsarh:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      TRUST_PROXY: "1"
      DATA_DIR: /data
    volumes:
      - alsarh_data:/data
    networks: [internal]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ALSARH_DOMAIN: ${ALSARH_DOMAIN:?Set ALSARH_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [alsarh]
    networks: [internal]
networks:
  internal:
volumes:
  alsarh_data:
  caddy_data:
  caddy_config:
